apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stock-mesh
  labels:
    app: order-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      containers:
        - name: order-service
          image: order-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: STOCK_SERVICE_URL
              value: http://stock-service:3000
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: stock-mesh
spec:
  selector:
    app: order-service
  ports:
    - port: 3001
      targetPort: 3001
